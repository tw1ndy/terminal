<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tw1ndy Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0812;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #e0e0e0;
            padding: 10px;
        }
        .container {
            max-width: 100%;
            width: 100%;
            background: rgba(18, 14, 30, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px 15px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(160, 80, 255, 0.3);
            border: 1px solid rgba(160, 80, 255, 0.2);
            text-align: center;
        }
        .neon-nick {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #c084fc;
            text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #7c3aed, 0 0 80px #7c3aed;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 16px;
            color: #a78bfa;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(160, 80, 255, 0.2);
            padding-bottom: 10px;
        }
        .selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .selector select {
            padding: 8px 15px;
            border-radius: 10px;
            background: #1a1628;
            color: #e0e0e0;
            border: 1px solid rgba(160, 80, 255, 0.3);
            font-size: 16px;
        }
        .selector button {
            padding: 8px 20px;
            background: #a855f7;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .selector button:hover {
            background: #7c3aed;
            box-shadow: 0 0 20px rgba(160, 80, 255, 0.4);
        }
        .card {
            background: rgba(30, 27, 45, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 15px;
            border-left: 5px solid #a855f7;
            box-shadow: 0 0 20px rgba(160, 80, 255, 0.1);
            text-align: left;
            margin-bottom: 15px;
        }
        .card h3 {
            color: #c4b5fd;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid rgba(160, 80, 255, 0.05);
            flex-wrap: wrap;
        }
        .price-row:last-child { border-bottom: none; }
        .green { color: #4ade80; }
        .red { color: #f87171; }
        .yellow { color: #facc15; }
        .spread-box {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid rgba(160, 80, 255, 0.2);
            font-size: 18px;
            color: #c4b5fd;
            text-align: center;
        }
        .update-info {
            margin-top: 15px;
            font-size: 12px;
            color: #6b7280;
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #8b5cf6;
            border-top: 1px solid rgba(160, 80, 255, 0.15);
            padding-top: 15px;
        }
        .footer span { color: #f472b6; }
        .error-text {
            color: #f87171;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neon-nick">tw1ndy</div>
        <div class="subtitle">CRYPTO TERMINAL</div>

        <div class="selector">
            <select id="coinSelect">
                <option value="bitcoin">BTC</option>
                <option value="ethereum">ETH</option>
                <option value="solana">SOL</option>
                <option value="dodo">DODO</option>
            </select>
            <button onclick="loadCoin()">Обновить</button>
        </div>

        <div class="card">
            <h3 id="coinLabel">BTC/USDT</h3>
            <div id="price-list">Загрузка...</div>
            <div class="spread-box" id="spread">Спред: ...</div>
        </div>

        <div class="update-info">обновляется каждые 5 секунд</div>
        <div class="footer">сделано с любовью для <span>tw1ndy</span></div>
    </div>

    <script>
        let currentCoin = 'bitcoin';
        let coinIdMap = {
            'bitcoin': 'BTC',
            'ethereum': 'ETH',
            'solana': 'SOL',
            'dodo': 'DODO'
        };

        // Функция получения цены через Binance (резервный вариант)
        async function getPriceFromBinance(symbol) {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}USDT`);
                const data = await response.json();
                return parseFloat(data.price);
            } catch {
                return null;
            }
        }

        // Основная функция получения цены
        async function getPrice(coinId) {
            const symbol = coinIdMap[coinId];
            
            // Пробуем CoinGecko
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
                const data = await response.json();
                if (data[coinId] && data[coinId].usd) {
                    return data[coinId].usd;
                }
            } catch {
                // Если CoinGecko не работает, пробуем Binance
                const binancePrice = await getPriceFromBinance(symbol);
                if (binancePrice) {
                    return binancePrice;
                }
            }
            return null;
        }

        async function loadCoin() {
            const coin = document.getElementById('coinSelect').value;
            currentCoin = coin;
            const symbol = coinIdMap[coin];
            document.getElementById('coinLabel').textContent = symbol + '/USDT';
            await fetchData(coin);
        }

        async function fetchData(coin) {
            try {
                const price = await getPrice(coin);
                
                if (!price) {
                    document.getElementById('price-list').innerHTML = '<div class="error-text">⚠️ Нет данных. Попробуйте позже.</div>';
                    document.getElementById('spread').textContent = '💰 Спред: нет данных';
                    return;
                }

                // Имитация цен на разных биржах (для демонстрации спреда)
                const prices = {
                    "Binance": price,
                    "Bybit": price * (1 + (Math.random() - 0.5) * 0.002),
                    "OKX": price * (1 + (Math.random() - 0.5) * 0.002)
                };

                const values = Object.values(prices);
                const minPrice = Math.min(...values);
                const maxPrice = Math.max(...values);

                let html = '';
                for (const [exchange, p] of Object.entries(prices)) {
                    let status = '', cls = '';
                    if (p === minPrice) { status = '🟢 НИЗКАЯ'; cls = 'green'; }
                    else if (p === maxPrice) { status = '🔴 ВЫСОКАЯ'; cls = 'red'; }
                    else { status = '🟡 СРЕДНЯЯ'; cls = 'yellow'; }
                    html += `<div class="price-row"><span>${exchange}</span><span class="${cls}">$${p.toFixed(2)} — ${status}</span></div>`;
                }
                document.getElementById('price-list').innerHTML = html;
                document.getElementById('spread').textContent = '💰 Спред: $' + (maxPrice - minPrice).toFixed(2);
            } catch (e) {
                document.getElementById('price-list').innerHTML = '<div class="error-text">⚠️ Ошибка загрузки. Попробуйте позже.</div>';
                document.getElementById('spread').textContent = '💰 Спред: ошибка';
            }
        }

        // Загрузка при старте
        fetchData('bitcoin');
        setInterval(function() {
            fetchData(currentCoin);
        }, 30000);
    </script>
</body>
</html>
