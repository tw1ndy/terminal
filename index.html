<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>tw1ndy Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0812;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(18, 14, 30, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(160, 80, 255, 0.3);
            border: 1px solid rgba(160, 80, 255, 0.2);
            text-align: center;
        }
        .neon-nick {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #c084fc;
            text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #7c3aed, 0 0 80px #7c3aed;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 18px;
            color: #a78bfa;
            letter-spacing: 6px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(160, 80, 255, 0.2);
            padding-bottom: 15px;
        }
        .selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .selector select {
            padding: 10px 20px;
            border-radius: 10px;
            background: #1a1628;
            color: #e0e0e0;
            border: 1px solid rgba(160, 80, 255, 0.3);
            font-size: 18px;
        }
        .selector button {
            padding: 10px 25px;
            background: #a855f7;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .selector button:hover {
            background: #7c3aed;
            box-shadow: 0 0 20px rgba(160, 80, 255, 0.4);
        }
        .card {
            background: rgba(30, 27, 45, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 20px;
            border-left: 5px solid #a855f7;
            box-shadow: 0 0 20px rgba(160, 80, 255, 0.1);
            text-align: left;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #c4b5fd;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 18px;
            font-weight: 500;
            border-bottom: 1px solid rgba(160, 80, 255, 0.05);
        }
        .price-row:last-child { border-bottom: none; }
        .green { color: #4ade80; }
        .red { color: #f87171; }
        .yellow { color: #facc15; }
        .spread-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(160, 80, 255, 0.2);
            font-size: 20px;
            color: #c4b5fd;
            text-align: center;
        }
        .change-positive { color: #4ade80; }
        .change-negative { color: #f87171; }
        .update-info {
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }
        .footer {
            margin-top: 35px;
            font-size: 16px;
            color: #8b5cf6;
            border-top: 1px solid rgba(160, 80, 255, 0.15);
            padding-top: 25px;
        }
        .footer span { color: #f472b6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="neon-nick">tw1ndy</div>
        <div class="subtitle">CRYPTO TERMINAL</div>

        <div class="selector">
            <select id="coinSelect">
                <option value="bitcoin">BTC</option>
                <option value="ethereum">ETH</option>
                <option value="solana">SOL</option>
                <option value="dodo">DODO</option>
            </select>
            <button onclick="loadCoin()">Обновить</button>
        </div>

        <div class="card">
            <h3 id="coinLabel">BTC/USDT</h3>
            <div id="price-list">Загрузка...</div>
            <div class="spread-box" id="spread">Спред: ...</div>
        </div>

        <div class="update-info">обновляется каждые 30 секунд</div>
        <div class="footer">сделано с любовью для <span>tw1ndy</span></div>
    </div>

    <script>
        let currentCoin = 'bitcoin';

        async function loadCoin() {
            const coin = document.getElementById('coinSelect').value;
            currentCoin = coin;
            document.getElementById('coinLabel').textContent = coin.toUpperCase() + '/USDT';
            await fetchData(coin);
        }

        async function fetchData(coin) {
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=usd`);
                const data = await response.json();
                const price = data[coin]?.usd;

                if (!price) {
                    document.getElementById('price-list').innerHTML = 'Нет данных для этой монеты';
                    return;
                }

                const prices = {
                    "Binance": price,
                    "Bybit": price * 0.999,
                    "OKX": price * 1.001
                };

                const values = Object.values(prices);
                const minPrice = Math.min(...values);
                const maxPrice = Math.max(...values);

                let html = '';
                for (const [exchange, p] of Object.entries(prices)) {
                    let status = '', cls = '';
                    if (p === minPrice) { status = '🟢 НИЗКАЯ'; cls = 'green'; }
                    else if (p === maxPrice) { status = '🔴 ВЫСОКАЯ'; cls = 'red'; }
                    else { status = '🟡 СРЕДНЯЯ'; cls = 'yellow'; }
                    html += `<div class="price-row"><span>${exchange}</span><span class="${cls}">$${p.toFixed(2)} — ${status}</span></div>`;
                }
                document.getElementById('price-list').innerHTML = html;
                document.getElementById('spread').textContent = '💰 Спред: $' + (maxPrice - minPrice).toFixed(2);
            } catch (e) {
                document.getElementById('price-list').innerHTML = 'Ошибка загрузки данных';
            }
        }

        fetchData('bitcoin');
        setInterval(function() {
            fetchData(currentCoin);
        }, 30000);
    </script>
</body>
</html>
