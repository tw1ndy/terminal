name = "nk-activity"
main = "src/index.ts"
compatibility_date = "2026-11-19"

[vars]
APP_TIMEZONE = "Europe/Moscow"
APP_ENV = "production"
TARGET_CHAT_ID = "-1004353159956"

[[d1_databases]]
binding = "DB"
database_name = "nk-activity-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["5 0 * * *", "*/15 * * * *"]

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true
