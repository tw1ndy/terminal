name: Set Telegram webhook

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk-activity-webhook
  cancel-in-progress: false

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN Actions secret"; exit 1; }
          test -n "$TELEGRAM_WEBHOOK_SECRET" || { echo "Missing TELEGRAM_WEBHOOK_SECRET Actions secret"; exit 1; }
          if ! [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]]; then
            echo "TELEGRAM_WEBHOOK_SECRET has an invalid format"
            exit 1
          fi
      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER_URL: https://nk-activity.tw1ndy228.workers.dev/webhook
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET;
          const url = process.env.WORKER_URL;
          const response = await fetch(`https://api.telegram.org/bot${token}/setWebhook`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              url,
              secret_token: secret,
              allowed_updates: ["message"],
              drop_pending_updates: false
            })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            console.error("Telegram rejected setWebhook:", result.description || response.status);
            process.exit(1);
          }
          console.log("Webhook configured successfully.");
          console.log("Worker URL:", url);
          console.log("Pending updates preserved:", true);
          NODE
