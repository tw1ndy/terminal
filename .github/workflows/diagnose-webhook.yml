name: Diagnose Telegram webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot identity and webhook status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN"; exit 1; }
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          async function call(method) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`);
            const data = await response.json();
            if (!response.ok || !data.ok) throw new Error(`${method} failed: ${data.description || response.status}`);
            return data.result;
          }
          const [me, webhook] = await Promise.all([call("getMe"), call("getWebhookInfo")]);
          console.log("Bot username:", me.username ? "@" + me.username : "(not set)");
          console.log("Webhook URL:", webhook.url || "(empty)");
          console.log("Pending updates:", webhook.pending_update_count ?? "unknown");
          console.log("Last delivery error:", webhook.last_error_message || "(none)");
          console.log("Last delivery error date:", webhook.last_error_date || "(none)");
          console.log("Allowed updates:", JSON.stringify(webhook.allowed_updates || []));
          NODE
